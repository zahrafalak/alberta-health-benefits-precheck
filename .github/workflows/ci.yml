name: CI

# Tests and builds every push and pull request. Vercel deploys: a preview for every
# pull request, and production when main changes.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Type-checks, then builds
      - name: Build
        run: npm run build
